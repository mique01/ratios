services:
  - type: web
    name: pair-trading-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: pair-trading-ui
    runtime: static
    buildCommand: echo "No build required"
    staticPublishPath: frontend
